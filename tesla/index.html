<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COGITATOR · Tesla sign-in</title>
<style>body{background:#000604;color:#3dffc8;font-family:monospace;padding:32px;text-transform:uppercase;letter-spacing:2px}b{color:#e8fff8}#c{font-size:22px;word-break:break-all;color:#e8fff8;border:2px solid #0affba;padding:16px;margin:16px 0;text-transform:none}button{font:inherit;background:#0affba;color:#000;border:0;padding:12px 18px}</style></head>
<body><div>COGITATOR // TESLA SIGN-IN</div><div id="c">NO CODE IN THIS ADDRESS</div><button id="b">COPY</button>
<p>The link window on the laptop picks this up by itself when you copy the address bar or press COPY.</p>
<script>const q=new URLSearchParams(location.search),c=q.get('code');if(c){document.getElementById('c').textContent=location.href}
document.getElementById('b').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>b.textContent='COPIED')</script></body></html>
